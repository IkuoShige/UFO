name: k1_22dof
xml_path: ../booster_assets/robots/K1/K1_22dof.xml
base_body: Trunk
root_quat_order: xyzw
coordinate_system: z_up
dof_unit: rad
control_joints:
  mode: explicit
  names:
    - AAHead_yaw
    - Head_pitch
    - ALeft_Shoulder_Pitch
    - Left_Shoulder_Roll
    - Left_Elbow_Pitch
    - Left_Elbow_Yaw
    - ARight_Shoulder_Pitch
    - Right_Shoulder_Roll
    - Right_Elbow_Pitch
    - Right_Elbow_Yaw
    - Left_Hip_Pitch
    - Left_Hip_Roll
    - Left_Hip_Yaw
    - Left_Knee_Pitch
    - Left_Ankle_Pitch
    - Left_Ankle_Roll
    - Right_Hip_Pitch
    - Right_Hip_Roll
    - Right_Hip_Yaw
    - Right_Knee_Pitch
    - Right_Ankle_Pitch
    - Right_Ankle_Roll
feet:
  - left_foot_link
  - right_foot_link
hands:
  - left_hand_link
  - right_hand_link
key_bodies:
  - Trunk
  - left_hand_link
  - right_hand_link
  - left_foot_link
  - right_foot_link
default_dof_pos: {}
training:
  hydra_robot: k1/k1_22dof_auto
  # G1 parity: 30% of training episodes start lying down so the policy learns to
  # get up (matches configs/robots/g1_29dof.yaml).
  hydra_overrides:
    - env.config.lie_down_init=True
    - env.config.lie_down_init_prob=0.3
  semantics:
    contact_bodies:
      - left_foot_link
      - right_foot_link
    undesired_contact_bodies:
      - Trunk
      - Left_Hip_Pitch
      - Left_Hip_Roll
      - Left_Hip_Yaw
      - Right_Hip_Pitch
      - Right_Hip_Roll
      - Right_Hip_Yaw
    torso_name: Trunk
    left_ankle_dof_names:
      - Left_Ankle_Pitch
      - Left_Ankle_Roll
    right_ankle_dof_names:
      - Right_Ankle_Pitch
      - Right_Ankle_Roll
  init_state:
    pos:
      - 0.0
      - 0.0
      - 0.53
    rot:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
    lin_vel:
      - 0.0
      - 0.0
      - 0.0
    ang_vel:
      - 0.0
      - 0.0
      - 0.0
    # median upright-frame pose of the retargeted LAFAN1 K1 dataset (symmetrised); root z 0.53 = foot-contact height at this pose.
    default_joint_angles:
      AAHead_yaw: 0.0
      Head_pitch: 0.2
      ALeft_Shoulder_Pitch: 0.0
      Left_Shoulder_Roll: -1.3
      Left_Elbow_Pitch: 0.5
      Left_Elbow_Yaw: -1.0
      ARight_Shoulder_Pitch: 0.0
      Right_Shoulder_Roll: 1.3
      Right_Elbow_Pitch: 0.5
      Right_Elbow_Yaw: 1.0
      Left_Hip_Pitch: -0.33
      Left_Hip_Roll: 0.13
      Left_Hip_Yaw: 0.11
      Left_Knee_Pitch: 0.63
      Left_Ankle_Pitch: -0.21
      Left_Ankle_Roll: -0.08
      Right_Hip_Pitch: -0.33
      Right_Hip_Roll: -0.13
      Right_Hip_Yaw: -0.11
      Right_Knee_Pitch: 0.63
      Right_Ankle_Pitch: -0.21
      Right_Ankle_Roll: 0.08
  control:
    # 0.5 (vs G1's 0.25): PD-target envelope is action_clip*action_scale*(effort_limit/kp);
    # with K1's effort/kp this restores G1-equivalent commandable range (knee up to ~2.3 rad for get-up poses).
    action_scale: 0.5
    action_clip_value: 5.0
    normalize_action_to: 5.0
    effort_limit_scale: 1.0
    effort_limit:
      - 6.0
      - 6.0
      - 14.0
      - 14.0
      - 14.0
      - 14.0
      - 14.0
      - 14.0
      - 14.0
      - 14.0
      - 30.0
      - 35.0
      - 20.0
      - 40.0
      - 20.0
      - 20.0
      - 30.0
      - 35.0
      - 20.0
      - 40.0
      - 20.0
      - 20.0
    velocity_limit:
      - 18.0
      - 18.0
      - 18.0
      - 18.0
      - 18.0
      - 18.0
      - 18.0
      - 18.0
      - 18.0
      - 18.0
      - 7.1
      - 12.9
      - 18.1
      - 12.5
      - 18.1
      - 18.1
      - 7.1
      - 12.9
      - 18.1
      - 12.5
      - 18.1
      - 18.1
    # kp = armature*(2*pi*f)^2, kd = 2*zeta*armature*(2*pi*f) on K1_22dof.xml armatures;
    # legs f=4Hz zeta=1.5 (knee zeta=1.0) per BoosterRobotics/booster_train, arms/head f=10Hz zeta=2 (same rule that generates UFO's G1 gains).
    stiffness:
      AAHead_yaw: 7.9
      Head_pitch: 7.9
      ALeft_Shoulder_Pitch: 3.95
      Left_Shoulder_Roll: 3.95
      Left_Elbow_Pitch: 3.95
